<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCChart Interpreter</title>
    <link rel="stylesheet" href="/styles.css" />

    <script type="module" src="/app.ts"></script>
  </head>
  <body>
    <div id="header">
      <h1>
        SCChart Interpreter v1 <span id="version-hash">(__GIT_HASH__)</span>
      </h1>

      <button id="sctx-tab" class="button" disabled>Use SCTX</button>

      <label for="json-file" id="load-json-label" class="button load-file"
        >Load JSON Model</label
      >
      <input id="json-file" type="file" accept=".json" style="display: none" />

      <a href="https://github.com/kieler/sccharts-interpreter" id="github-link">
        <svg
          data-component="Octicon"
          aria-hidden="true"
          focusable="false"
          class="octicon octicon-mark-github"
          viewBox="0 0 24 24"
          width="30"
          height="30"
          fill="currentColor"
          display="inline-block"
          overflow="visible"
          style="vertical-align: text-bottom"
        >
          <path
            d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188 .5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"
          ></path>
        </svg>
      </a>
    </div>

    <div class="main-area">
      <div id="model-sctx" style="display: flex">
        <h3 class="panel-header">SCChart Model</h3>
        <div id="sctx-text-input" class="panel-content"></div>
        <div id="model-control" class="panel-content control-panel">
          <label for="sctx-file" id="load-sctx-label" class="button load-file">
            Upload SCTX
          </label>
          <input
            id="sctx-file"
            type="file"
            accept=".sctx"
            style="display: none"
          />

          <button id="compile-button" class="control-button button">
            Compile
          </button>
          <button id="diagram-button" class="control-button button" disabled>
            Generate Diagram
          </button>
        </div>
        <textarea
          id="scchart-textarea"
          class="input-textarea"
          placeholder="Your SCChart Model"
        ></textarea>

        <h3 class="panel-header">Diagram</h3>
        <div id="sctx-diagram" class="panel-content"></div>
        <div id="diagram-div">
          <img id="diagram-image" src="" alt="" />
        </div>
      </div>
      <div id="model-status">
        <h3 class="panel-header">Controlls</h3>
        <div id="model-control" class="panel-content control-panel">
          <h4 id="model-name">No Model loaded yet</h4>
          <button id="advance-tick" class="control-button button" disabled>
            Tick
          </button>
          <button id="auto-run" class="control-button button" disabled>
            Auto Run
          </button>
          <button id="loop-inputs" class="control-button button" disabled>
            ✖ Loop Inputs
          </button>
          <input
            type="range"
            id="auto-timer"
            min="0"
            max="1000"
            step="50"
            value="300"
            oninput="this.nextElementSibling.value = this.value + ' ms'"
            disabled
          />
          <output id="timer-value">300 ms</output>
          <button id="reset" class="control-button button" disabled>
            Reset Model
          </button>
        </div>

        <h3 class="panel-header">Inputs</h3>
        <div id="model-input" class="panel-content inputs-panel"></div>
        <textarea
          id="input-json"
          class="input-textarea"
          placeholder="Inputs as JSON"
        ></textarea>

        <h3 class="panel-header">Other Variables</h3>
        <div id="model-variables" class="panel-content"></div>
      </div>
      <div id="model-output">
        <h3 class="panel-header">Outputs</h3>
        <div id="model-output-list" class="panel-content"></div>
        <textarea
          id="output-history"
          class="output-textarea"
          readonly
          placeholder="Output history will appear here."
          disabled
        ></textarea>
      </div>
    </div>

    <div id="log-div">
      <button id="toggle-log">Show Log</button>
      <pre id="log" style="display: none"></pre>
    </div>
  </body>

  <script>
    window.__GIT_HASH__ = __GIT_HASH__;
  </script>
</html>
